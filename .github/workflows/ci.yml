name: Docs CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Validate build
        run: mint validate

      - name: Check links
        run: mint broken-links

      - name: Reject em dashes
        run: |
          EM_DASH="$(printf '\xe2\x80\x94')"
          if grep -rn --include='*.mdx' --include='*.json' --include='*.yaml' "$EM_DASH" . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Replace em dashes with a comma, colon, period, or parentheses."
            exit 1
          fi
