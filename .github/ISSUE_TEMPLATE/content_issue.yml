name: Content issue
description: Report content that is incorrect, outdated, or confusing
title: "[content]: "
labels: ["content"]
body:
  - type: input
    id: page
    attributes:
      label: Affected page
      description: URL or path of the page (e.g. https://docs.stellarview.acachete.xyz/... or src/content/docs/...)
      placeholder: https://docs.stellarview.acachete.xyz/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong
      description: What is incorrect, outdated, or unclear on this page?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say
      description: If you know the correct information, share it here.
    validations:
      required: false
